# Despliega la app en GitHub Pages al hacer push a main
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Permite lanzar el deploy manualmente desde la pestaña Actions
  workflow_dispatch:

# Permisos para poder publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Una sola concurrencia por rama
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Nombre del repo = subruta en GitHub Pages (usuario.github.io/REPO_NAME/)
          BASE_PATH: ${{ github.event.repository.name }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
